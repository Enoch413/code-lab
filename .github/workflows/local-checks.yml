name: Local regression checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pdf_lab_ref:
        description: 'Reviewed PDF LAB commit SHA for cross-app checks (optional; 40 hex characters)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: node tools/test-local.mjs
      - run: npm ci --prefix tools/firebase-cli --ignore-scripts
      - run: node tools/test-tooling.mjs
      - run: node tools/test-rules-local.mjs
      - run: npm install --prefix .local/firebase-sdk --ignore-scripts --save-exact --no-audit --no-fund firebase@10.12.5
      - run: node tools/test-auth-integration-local.mjs
  python-lock:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r tools/requirements-firebase-admin.lock
      - run: python -m pip check
  cross-app:
    if: github.event_name == 'workflow_dispatch' && inputs.pdf_lab_ref != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: CODE LAB
    steps:
      - uses: actions/checkout@v4
        with:
          path: CODE LAB
          persist-credentials: false
      - name: Validate reviewed PDF revision
        env:
          PDF_REF: ${{ inputs.pdf_lab_ref }}
        run: node -e "if (!/^[0-9a-f]{40}$/.test(process.env.PDF_REF)) process.exit(1)"
      - uses: actions/checkout@v4
        with:
          repository: Enoch413/pdf-lab
          ref: ${{ inputs.pdf_lab_ref }}
          path: PDF LAB
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix tools/firebase-cli --ignore-scripts
      - run: npm ci --prefix tools/browser-tests --ignore-scripts
      - run: node tools/browser-tests/node_modules/playwright/cli.js install --with-deps chromium
      - run: node tests/run_checks.cjs
        working-directory: PDF LAB
      - run: node tools/test-cross-app-local.mjs
